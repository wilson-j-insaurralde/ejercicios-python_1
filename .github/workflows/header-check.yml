name: Check author header

on:
  push:
  pull_request:

jobs:
  header-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install requirements
        run: python -m pip install --upgrade pip
      - name: Run header verification
        run: python tools/verify_header.py
